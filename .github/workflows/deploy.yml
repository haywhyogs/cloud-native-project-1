name: CI/CD - Build, Push and Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Azure via OIDC
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Login to ACR
        run: az acr login --name monitoringacr3678

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./monitoring-app
          push: true
          tags: monitoringacr3678.azurecr.io/monitoring-app:${{ github.sha }}
      - name: Deploy to VM
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VM_IP }}
          username: azureuser
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            az acr login --name monitoringacr3678
            sed -i 's|monitoring-app:.*|monitoring-app:${{ github.sha }}|g' ~/docker-compose.yml
            docker-compose -f ~/docker-compose.yml up -d --pull always
