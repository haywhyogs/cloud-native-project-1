#cloud-config

package_update: true
package_upgrade: true

packages:
  - apt-transport-https
  - ca-certificates
  - curl
  - gnupg
  - lsb-release

users:
  - default
  - name: azureuser
    groups: docker
    shell: /bin/bash

write_files:
  - path: /home/azureuser/docker-compose.yml
    permissions: '0644'
    content: |
      services:
        web:
          image: nginx:latest
          ports:
            - "5000:80"
          restart: always
        monitor:
          image: containrrr/watchtower
          restart: always

runcmd:
  # Install Docker
  - apt-get update -y
  - apt-get install -y docker.io curl

  # Enable Docker
  - systemctl enable docker
  - systemctl start docker

  # Wait for Docker daemon
  - |
    for i in {1..10}; do
      docker info && break
      sleep 2
    done

  # Install Docker Compose (stable binary - matches your working setup)
  - curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-linux-x86_64" -o /usr/local/bin/docker-compose
  - chmod +x /usr/local/bin/docker-compose

  # Start containers using the correct tool
  - docker-compose -f /home/azureuser/docker-compose.yml up -d
